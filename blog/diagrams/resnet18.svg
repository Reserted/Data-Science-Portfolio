<text x="422.0" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6470" text-anchor="middle" font-weight="normal" font-style="normal">shortcut: identity, or Conv 1×1 /2 + BatchNorm in the first block of layer2–4 (where the shape changes)</text>
<text x="40" y="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d232b" text-anchor="start" font-weight="bold" font-style="normal">BatchNorm, per channel:</text>
<text x="205" y="460" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1d232b" text-anchor="start" font-weight="normal" font-style="normal" xml:space="preserve">y = γ · (x − μ) / √(σ² + ε) + β</text>
<text x="40" y="484" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6470" text-anchor="start" font-weight="normal" font-style="normal">training (model.train()): μ, σ² are the mean and variance of the current mini-batch over N × H × W positions,</text>
<text x="40" y="502" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6470" text-anchor="start" font-weight="normal" font-style="normal">so the batch size B sets their sample size. Evaluation (model.eval()): running averages collected during training.</text>
<text x="40" y="526" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6470" text-anchor="start" font-weight="normal" font-style="normal">20 BatchNorm layers in all. The MLP and the CNN have none.</text>
</svg>
