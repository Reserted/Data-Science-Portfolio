<text x="870.0" y="366.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal" font-style="normal" xml:space="preserve">figures/&lt;slug&gt;/results.md</text>
<line x1="870.0" y1="207" x2="870.0" y2="249" stroke="#5b6470" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 966 207 L 966 329" fill="none" stroke="#5b6470" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="760" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6470" text-anchor="start" font-weight="normal" font-style="normal">best(): each model's best value is</text>
<text x="760" y="426" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6470" text-anchor="start" font-weight="normal" font-style="normal">picked on mean validation accuracy;</text>
<text x="760" y="442" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6470" text-anchor="start" font-weight="normal" font-style="normal">test accuracy is reported for it,</text>
