<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="Experiment harness: data preparation, the seeded sweep, and the outputs">
<title>Experiment harness: data preparation, the seeded sweep, and the outputs</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d232b"/></marker><marker id="arrow-res" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker>
</defs>
<rect width="1000" height="520" fill="#fcfcfb"/>
<text x="20" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1d232b" text-anchor="start" font-weight="bold" font-style="normal">1 · Data, prepared once</text>
<rect x="20" y="48" width="210" height="46" rx="6" fill="#fff" stroke="#c9d1da" stroke-width="1.3"/>
<text x="125.0" y="68.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d232b" text-anchor="middle" font-weight="normal" font-style="normal">torchvision dataset</text>
<text x="125.0" y="84.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal" font-style="normal" xml:space="preserve">KMNIST · EuroSAT · USPS</text>
<rect x="20" y="122" width="210" height="46" rx="6" fill="#fff" stroke="#c9d1da" stroke-width="1.3"/>
<text x="125.0" y="142.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d232b" text-anchor="middle" font-weight="normal" font-style="normal">Decode to tensors</text>
<text x="125.0" y="158.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal" font-style="normal" xml:space="preserve">load()</text>
<line x1="125.0" y1="95" x2="125.0" y2="121" stroke="#5b6470" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="20" y="196" width="210" height="46" rx="6" fill="#fff" stroke="#c9d1da" stroke-width="1.3"/>
<text x="125.0" y="216.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d232b" text-anchor="middle" font-weight="normal" font-style="normal">Fixed split, seed 42</text>
<text x="125.0" y="232.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal" font-style="normal" xml:space="preserve">holdout()</text>
<line x1="125.0" y1="169" x2="125.0" y2="195" stroke="#5b6470" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="20" y="270" width="210" height="46" rx="6" fill="#fff" stroke="#c9d1da" stroke-width="1.3"/>
<text x="125.0" y="290.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d232b" text-anchor="middle" font-weight="normal" font-style="normal">Normalise per channel</text>
<text x="125.0" y="306.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal" font-style="normal" xml:space="preserve">train mean / std</text>
<line x1="125.0" y1="243" x2="125.0" y2="269" stroke="#5b6470" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="20" y="344" width="210" height="46" rx="6" fill="#f2f4f6" stroke="#c9d1da" stroke-width="1.3"/>
<text x="125.0" y="364.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d232b" text-anchor="middle" font-weight="normal" font-style="normal">Resident on the GPU</text>
<text x="125.0" y="380.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal" font-style="normal" xml:space="preserve">train · val · test</text>
<line x1="125.0" y1="317" x2="125.0" y2="343" stroke="#5b6470" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="20" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6470" text-anchor="start" font-weight="normal" font-style="normal">No DataLoader in the training loop:</text>
<text x="20" y="456" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6470" text-anchor="start" font-weight="normal" font-style="normal">batches are index slices of GPU tensors,</text>
<text x="20" y="472" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6470" text-anchor="start" font-weight="normal" font-style="normal">so the timer measures compute only.</text>
<rect x="270" y="44" width="440" height="456" rx="10" fill="#f2f4f6" stroke="#c9d1da"/>
<text x="270" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1d232b" text-anchor="start" font-weight="bold" font-style="normal">2 · sweep(param, values)</text>
<text x="288" y="70" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#1d232b" text-anchor="start" font-weight="normal" font-style="normal" xml:space="preserve">for value in grid  ×  model in (MLP, CNN, ResNet-18)  ×  seed in (0, 1, 2):</text>
<text x="288" y="96" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" fill="#5b6470" text-anchor="start" font-weight="normal" font-style="normal" xml:space="preserve">run(model, seed, epochs, param=value)</text>
<rect x="310" y="116" width="360" height="44" rx="6" fill="#fff" stroke="#c9d1da" stroke-width="1.3"/>
<text x="490.0" y="135.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d232b" text-anchor="middle" font-weight="normal" font-style="normal">torch.manual_seed(seed); make_model()</text>
<text x="490.0" y="151.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal" font-style="normal" xml:space="preserve">same initial weights for every value</text>
<rect x="310" y="182" width="360" height="44" rx="6" fill="#fff" stroke="#c9d1da" stroke-width="1.3"/>
<text x="490.0" y="201.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d232b" text-anchor="middle" font-weight="normal" font-style="normal">Shuffle with a seeded generator</text>
<text x="490.0" y="217.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal" font-style="normal" xml:space="preserve">same batch order for every value</text>
<line x1="490.0" y1="161" x2="490.0" y2="181" stroke="#5b6470" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="310" y="248" width="360" height="44" rx="6" fill="#fff" stroke="#c9d1da" stroke-width="1.3"/>
<text x="490.0" y="267.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d232b" text-anchor="middle" font-weight="normal" font-style="normal">SGD, momentum 0.9, constant η</text>
<text x="490.0" y="283.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal" font-style="normal" xml:space="preserve">last partial batch dropped</text>
<line x1="490.0" y1="227" x2="490.0" y2="247" stroke="#5b6470" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="310" y="314" width="360" height="44" rx="6" fill="#fff" stroke="#c9d1da" stroke-width="1.3"/>
<text x="490.0" y="333.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d232b" text-anchor="middle" font-weight="normal" font-style="normal">model.eval(): score two sets</text>
<text x="490.0" y="349.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal" font-style="normal" xml:space="preserve">train probe (first 5,000) · validation</text>
<line x1="490.0" y1="293" x2="490.0" y2="313" stroke="#5b6470" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="310" y="380" width="360" height="44" rx="6" fill="#fff" stroke="#c9d1da" stroke-width="1.3"/>
<text x="490.0" y="399.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d232b" text-anchor="middle" font-weight="normal" font-style="normal">Append one row per epoch</text>
<text x="490.0" y="415.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal" font-style="normal" xml:space="preserve">loss, accuracy, ‖θ‖, training seconds</text>
<line x1="490.0" y1="359" x2="490.0" y2="379" stroke="#5b6470" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 670 402 L 692 402 L 692 204 L 672 204" fill="none" stroke="#5b6470" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="700" y="307.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5b6470" text-anchor="start" font-weight="normal" font-style="normal">× epochs</text>
<path d="M 302 248 L 296 248 L 296 292 L 302 292" fill="none" stroke="#1d232b" stroke-width="1.2"/>
<text x="290" y="274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#1d232b" text-anchor="end" font-weight="normal" font-style="normal">timed</text>
<rect x="310" y="442" width="360" height="40" rx="6" fill="#fff" stroke="#1d232b" stroke-width="1.3"/>
<text x="490.0" y="466.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d232b" text-anchor="middle" font-weight="normal" font-style="normal">After the last epoch: test accuracy, once</text>
<line x1="490.0" y1="425" x2="490.0" y2="441" stroke="#5b6470" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="232" y1="367" x2="268" y2="367" stroke="#5b6470" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="760" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1d232b" text-anchor="start" font-weight="bold" font-style="normal">3 · Outputs</text>
<rect x="760" y="160" width="220" height="46" rx="6" fill="#f2f4f6" stroke="#c9d1da" stroke-width="1.3"/>
<text x="870.0" y="180.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d232b" text-anchor="middle" font-weight="normal" font-style="normal">runs.csv</text>
<text x="870.0" y="196.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal" font-style="normal" xml:space="preserve">one row per run × epoch</text>
<line x1="712" y1="183" x2="758" y2="183" stroke="#5b6470" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="760" y="250" width="220" height="46" rx="6" fill="#ffffff" stroke="#c9d1da" stroke-width="1.3"/>
<text x="870.0" y="270.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#1d232b" text-anchor="middle" font-weight="normal" font-style="normal">plot_final · plot_curves</text>
<text x="870.0" y="286.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="11" fill="#5b6470" text-anchor="middle" font-weight="normal" font-style="normal" xml:space="preserve">figures/&lt;slug&gt;/*.png</text>
