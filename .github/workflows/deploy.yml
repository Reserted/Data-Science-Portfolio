name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deploy at a time; don't cancel a run that's mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        # Drop --execute if you commit notebooks with outputs and want faster builds.
        env:
          BASE_URL: /${{ github.event.repository.name }}
        run: jupyter book build --html --execute

      - name: Copy the display font next to the stylesheet
        # style.css is emitted as <dir>/style-<hash>.css (dir has changed between MyST
        # versions: build/, _public/) and loads ./fonts/Rene-Regular.woff2; MyST copies
        # the stylesheet but not the font it references, so put the font beside it.
        run: |
          for css in $(find _build/html -name 'style-*.css'); do
            mkdir -p "$(dirname "$css")/fonts"
            cp public/fonts/Rene-Regular.woff2 "$(dirname "$css")/fonts/"
          done
          test -n "$(find _build/html -path '*/fonts/Rene-Regular.woff2')"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
